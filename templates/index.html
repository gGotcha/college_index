<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 48px auto; padding: 0 20px; background: #f7f8fa; color: #202938; }
    textarea { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; }
    button { padding: 8px 16px; margin-top: 8px; cursor: pointer; }
    article { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 16px; }
    article p { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>My Notes</h1>
  <form method="post">
    <label for="text">New note</label>
    <textarea id="text" name="text" rows="3" placeholder="Write something…" required></textarea>
    <button type="submit">Add note</button>
  </form>
  {% for note in notes %}
    <article>
      <p>{{ note['text'] }}</p>
      <form method="post" action="{{ url_for('delete_note', note_id=note['id']) }}">
        <button type="submit">Delete</button>
      </form>
    </article>
  {% else %}
    <p>No notes yet. Add your first one above.</p>
  {% endfor %}
</body>
</html>
